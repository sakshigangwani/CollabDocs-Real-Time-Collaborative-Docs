apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: collabdocs
resources:
  - job.yaml
# Keep in sync with ../kustomization.yaml so migrations run with the image being deployed.
images:
  - name: collabdocs-server
    newName: ghcr.io/your-org/collabdocs-server
    newTag: latest
