apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabdocs-web
  labels: { app: collabdocs-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: collabdocs-web }
  template:
    metadata:
      labels: { app: collabdocs-web }
    spec:
      containers:
        - name: web
          image: collabdocs-web
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: collabdocs-web
spec:
  selector: { app: collabdocs-web }
  ports:
    - { name: http, port: 80, targetPort: http }
