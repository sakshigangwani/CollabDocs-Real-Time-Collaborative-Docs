apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabdocs-server
  labels: { app: collabdocs-server }
spec:
  replicas: 2
  selector:
    matchLabels: { app: collabdocs-server }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: collabdocs-server }
    spec:
      # On SIGTERM the server persists every open document and closes sockets with
      # 1012 so editors reconnect to another replica; give it time to finish.
      terminationGracePeriodSeconds: 30
      containers:
        - name: server
          image: collabdocs-server
          ports:
            - { name: http, containerPort: 4000 }
            - { name: collab, containerPort: 4001 }
          envFrom:
            - configMapRef: { name: collabdocs-server }
            - secretRef: { name: collabdocs-server }
          env:
            # Shows up in /health and logs as the instance id.
            - name: INSTANCE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            # Let the ingress drop this pod from its endpoints before shutdown starts.
            preStop:
              exec: { command: ["sleep", "5"] }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: collabdocs-server
spec:
  selector: { app: collabdocs-server }
  ports:
    - { name: http, port: 4000, targetPort: http }
    - { name: collab, port: 4001, targetPort: collab }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: collabdocs-server
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: collabdocs-server }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: collabdocs-server
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: collabdocs-server }
