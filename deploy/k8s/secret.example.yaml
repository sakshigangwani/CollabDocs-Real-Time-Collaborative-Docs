# Template only — not included in kustomization.yaml, never commit real values.
# Create the real Secret with:
#   kubectl -n collabdocs create secret generic collabdocs-server --from-env-file=apps/server/.env
# or manage it with External Secrets / Sealed Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: collabdocs-server
  namespace: collabdocs
type: Opaque
stringData:
  DATABASE_URL: postgresql://USER:PASSWORD@HOST:5432/collabdocs?schema=public
  COLLAB_JWT_SECRET: change-me
  ATTACHMENT_SECRET: change-me
  S3_ACCESS_KEY_ID: ""
  S3_SECRET_ACCESS_KEY: ""
  OPENAI_API_KEY: ""
  RESEND_API_KEY: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
