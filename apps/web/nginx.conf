# Static SPA server for the web image (mirrors the headers in vercel.json).
server {
  listen 8080;
  root /usr/share/nginx/html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; form-action 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  # Hashed filenames; `expires` (not add_header) so the security headers above still apply.
  location /assets/ {
    expires 1y;
  }

  location /healthz {
    access_log off;
    return 200 "ok";
  }

  # Client-side routes fall back to the SPA shell.
  location / {
    try_files $uri /index.html;
  }
}
